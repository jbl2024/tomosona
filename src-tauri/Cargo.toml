[package]
name = "tomosona"
version = "26.9.28005"
description = "Local-first markdown editor"
authors = ["you"]
edition = "2021"

[lib]
name = "tomosona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["devtools"] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
directories = "6"
rfd = "0.17"
open = "5"
notify = "8"
notify-debouncer-full = "0.7.0"
ignore = "0.4"
unicode-normalization = "0.1"
base64 = "0.23.1"
atomicwrites = "0.4.4"
blake3 = "1.8.5"
comrak = "0.55.0"
mermaid-rs-renderer = { git = "https://github.com/1jehuang/mermaid-rs-renderer", tag = "v0.3.1", features = ["png"] }
# rdocx 0.14.0 currently fails to compile with fontdb 0.23 (its oxml-layout
# dependency does not handle Source::SharedFile); retain the latest verified
# compatible release until that upstream regression is fixed.
rdocx = "=0.1.2"
calamine = "0.36.1"
zip = "8"
portable-pty = "0.9"
