[package]
name = "tomosona"
version = "20260712.1.0"
description = "Local-first markdown editor"
authors = ["you"]
edition = "2021"

[lib]
name = "tomosona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
libsqlite3-sys = "=0.37.0"
directories = "6"
rfd = "0.17"
open = "5"
notify = "8"
notify-debouncer-full = "0.7.0"
ignore = "0.4"
fastembed = "5.16.0"
sqlite-vec = "0.1.9"
unicode-normalization = "0.1"
genai = "0.6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
atomicwrites = "0.4.4"
blake3 = "1.8.5"
comrak = "0.52"
mermaid-rs-renderer = { git = "https://github.com/1jehuang/mermaid-rs-renderer", tag = "v0.2.2", features = ["png"] }
rdocx = "0.1.2"
calamine = "0.36.0"
zip = "8"

[patch.crates-io]
tao = { git = "https://github.com/dgerhardt/tao", branch = "fix-wayland-csd" }
